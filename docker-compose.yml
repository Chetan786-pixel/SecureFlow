services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureflow
      POSTGRES_PASSWORD: secureflow
      POSTGRES_DB: secureflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow -d secureflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://secureflow:secureflow@db:5432/secureflow
      DATABASE_POOL_URL: postgresql://secureflow:secureflow@db:5432/secureflow
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "9002:9002"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://secureflow:secureflow@db:5432/secureflow
      DATABASE_POOL_URL: postgresql://secureflow:secureflow@db:5432/secureflow
    restart: unless-stopped

volumes:
  postgres_data:
